<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Matcha Studio</title>
    <link rel="stylesheet" href="matchashop.css">
    <style>
        .reset-header { padding: 20px 6%; background: #304b35; color: #fff; }
        .reset-header a { color: inherit; font-weight: bold; font-size: 1.3rem; text-decoration: none; }
        .reset-page { max-width: 560px; margin: 45px auto; padding: 0 18px; }
        .reset-card { padding: clamp(22px, 5vw, 40px); }
        .reset-card p { margin-bottom: 15px; }
        .reset-card .login-form[hidden] { display: none; }
        .reset-card .account-signout { display: inline-block; margin-top: 18px; }
    </style>
</head>
<body>
    <header class="reset-header"><a href="index.html">Matcha Studio</a></header>
    <main class="reset-page">
        <section class="login-card reset-card" aria-labelledby="reset-heading">
            <span class="section-eyebrow">MATCHA STUDIO ACCOUNT</span>
            <h2 id="reset-heading">Create a new password</h2>
            <p id="reset-status" role="status">Checking your password recovery link…</p>
            <form class="login-form" id="reset-form" hidden>
                <label for="new-password">New password</label>
                <input type="password" id="new-password" autocomplete="new-password" minlength="8" required>
                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" autocomplete="new-password" minlength="8" required>
                <label><input type="checkbox" id="show-passwords" style="width:auto;margin-right:6px"> Show passwords</label>
                <button type="submit" class="booking-submit">Update password</button>
            </form>
            <a class="account-signout" href="login.html">Back to Log In</a>
        </section>
    </main>
    <footer>© 2026 Matcha Studio</footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        (() => {
            const status = document.getElementById('reset-status');
            const form = document.getElementById('reset-form');
            const password = document.getElementById('new-password');
            const confirm = document.getElementById('confirm-password');
            const submit = form.querySelector('button[type="submit"]');
            if (!window.supabase) { status.textContent = 'Unable to connect. Please try again.'; return; }
            const client = window.supabase.createClient(MATCHA_SUPABASE_URL, MATCHA_SUPABASE_PUBLISHABLE_KEY);
            let recoverySession = false;
            client.auth.onAuthStateChange((event, session) => {
                if (event === 'PASSWORD_RECOVERY' && session) {
                    recoverySession = true;
                    form.hidden = false;
                    status.textContent = 'Enter and confirm your new password.';
                } else if (event === 'INITIAL_SESSION' && !recoverySession) {
                    status.textContent = 'Open the password reset link sent to your email. If it expired, request another link from Log In.';
                } else if (event === 'SIGNED_OUT') {
                    recoverySession = false;
                    form.hidden = true;
                }
            });
            document.getElementById('show-passwords').addEventListener('change', event => {
                password.type = confirm.type = event.target.checked ? 'text' : 'password';
            });
            form.addEventListener('submit', async event => {
                event.preventDefault();
                if (!recoverySession) return;
                if (password.value !== confirm.value) { status.textContent = 'Passwords do not match.'; return; }
                submit.disabled = true;
                try {
                    const { error } = await client.auth.updateUser({ password: password.value });
                    if (error) throw error;
                    recoverySession = false;
                    form.reset();
                    form.hidden = true;
                    const signout = await client.auth.signOut();
                    status.textContent = signout.error ? 'Password updated. Please sign out and log in again.' : 'Password updated successfully. Return to Log In using your new password.';
                } catch (error) { status.textContent = `Unable to update password: ${error.message}`; }
                finally { submit.disabled = false; }
            });
        })();
    </script>
</body>
</html>
