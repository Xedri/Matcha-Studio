
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Matcha Studio</title>
    <meta name="description" content="Discover Matcha Studio, a fictional café concept featuring handcrafted matcha drinks, specialty teas, and pastries.">
    <link rel="stylesheet" href="matchashop.css">
</head>
<body>


<!-- MATCHA STUDIO — NAVBAR -->
<header class="navbar">
    <nav aria-label="Main navigation">

        <!-- Brand: Left -->
        <a id="site-brand" href="index.html#home" class="brand">
            Matcha Studio
        </a>

        <!-- Navigation: Center -->
        <div class="nav-links">
            <a href="index.html#home">Home</a>
            <a href="menu.html" aria-current="page">Our Menu</a>
            <a href="index.html#about">About Us</a>
            <a href="store-locator.html">Store Locator</a>
            <a href="book-us.html">Book Us</a>
        </div>

        <!-- Shopping Cart: Right -->
        <button
            type="button"
            id="header-cart-btn"
            class="cart-btn"
            onclick="openCart()"
            aria-label="Open shopping basket"
        >
            <svg
                class="cart-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path d="M5 10h14l-1.5 9h-11L5 10z"></path>
                <path d="M9 10V6a3 3 0 0 1 6 0v4"></path>
                <line x1="9" y1="14" x2="9" y2="16"></line>
                <line x1="12" y1="14" x2="12" y2="16"></line>
                <line x1="15" y1="14" x2="15" y2="16"></line>
            </svg>

            <span id="item-count" class="cart-badge hidden">
                0
            </span>
        </button>

    </nav>
</header>



<!-- MATCHA STUDIO — HERO SECTION -->
<section id="menu" class="menu-section full-menu-layout">
    <aside class="menu-sidebar" aria-label="Menu categories">
        <h2>Categories</h2>
        <div id="category-filters" class="category-filters" aria-label="Filter menu by category"></div>
    </aside>
    <div class="menu-products">
        <div class="menu-products-heading">
            <span class="section-eyebrow">THE MATCHA COLLECTION</span>
            <h1 id="site-menu-heading">Explore our Menu</h1>
            <p>Find your next favorite drink or pastry.</p>
        </div>
        <div id="menu-grid" class="menu-grid"></div>
    </div>
</section>




<footer>
    <p id="site-footer">&copy; 2026 Matcha Studio — Demo Website</p>
</footer>

<!-- Cart Backdrop -->
<div id="cart-backdrop" class="cart-backdrop" onclick="closeCart()"></div>

<!-- Cart Drawer -->
<aside id="cart-drawer" class="cart-drawer" aria-hidden="true" inert>
    <div class="cart-drawer-header">
        <h2>Your Order</h2>
        <button type="button" class="close-cart-btn"
                onclick="closeCart()" aria-label="Close cart">&times;</button>
    </div>

    <div class="cart-drawer-body">
        <ul id="cart-list">
            <li class="empty-msg">Your cart is empty.</li>
        </ul>

        <hr class="divider">

        <p class="total-line">
            <strong>Total: ₱<span id="total-price">0.00</span></strong>
        </p>

        <button type="button" id="proceed-checkout-btn"
                class="proceed-checkout-btn"
                onclick="openCheckout()" disabled>
            Proceed to Checkout
        </button>
    </div>
</aside>

<!-- Separate Checkout Modal -->
<dialog id="checkout-modal" class="checkout-modal" aria-labelledby="checkout-title">
    <div class="checkout-box">
        <div class="checkout-header">
            <h2 id="checkout-title">Checkout</h2>
            <button type="button" class="close-checkout-btn"
                    onclick="closeCheckout()" aria-label="Close checkout">&times;</button>
        </div>

        <div class="checkout-body">
            <h3>Order Summary</h3>
            <ul id="checkout-summary"></ul>

            <p class="checkout-total">
                <strong>Total: ₱<span id="checkout-total">0.00</span></strong>
            </p>

            <hr class="divider">

            <form id="checkout-form" onsubmit="placeOrder(event)">
                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" name="full-name"
                       placeholder="Enter your name" required>

                <label for="contact-number">Contact Number</label>
                <input type="tel" id="contact-number" name="contact-number"
                       placeholder="Enter your contact number" required>

                <label for="order-type">Order Type</label>
                <select id="order-type" name="order-type" required>
                    <option value="" disabled selected>Select order type</option>
                    <option value="Dine-in">Dine-in</option>
                    <option value="Pick-up">Pick-up</option>
                    <option value="Delivery">Delivery</option>
                </select>

                <button type="submit" class="place-order-btn">Place Order</button>
            </form>
        </div>
    </div>
</dialog>


<script src="matchashop.js"></script>
</body>
</html>
