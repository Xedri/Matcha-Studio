<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Matcha Studio</title>
    <link rel="stylesheet" href="matchashop.css">
    <style>
        .account-header { padding: 20px 6%; background: #304b35; color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .account-header a { color: inherit; text-decoration: none; }
        .account-header strong { font-size: 1.35rem; }
        .standalone-account { display: grid; place-items: center; max-width: 580px; min-height: 75vh; margin: auto; padding: 34px 18px; }
        .standalone-account .login-card { width: 100%; }
        .standalone-account .login-card > p { margin-bottom: 20px; }
        .account-return { display: block; margin-top: 20px; text-align: center; font-size: .9rem; color: #304b35; }
        .account-message { font-size: .9rem; color: #536c50; }
        .account-message.error { color: #a83c37; }
        .booking-submit:disabled { opacity: .5; }
    </style>
  <link rel="stylesheet" href="studio-assets/studio.css">
</head>
<body>
    <header class="account-header"><a href="index.html"><strong>Matcha Studio</strong></a><a href="login.html">Log In</a></header>
    <main class="standalone-account">
        <section class="login-card" aria-labelledby="forgot-heading">
            <span class="section-eyebrow">MATCHA STUDIO ACCOUNT</span>
            <h2 id="forgot-heading">Forgot your password?</h2>
            <p>Enter the email address associated with your account. We'll send you a password reset link.</p>
            <form id="forgot-form" class="login-form" method="post">
                <label for="forgot-email">Email address</label>
                <input id="forgot-email" type="email" autocomplete="email" placeholder="Enter your email" required>
                <p id="forgot-status" class="account-message" role="status" hidden></p>
                <button type="submit" class="booking-submit" disabled>Send reset link →</button>
            </form>
            <a class="account-return" href="login.html">Back to Log In</a>
        </section>
    </main>
    <footer>© 2026 Matcha Studio — Demo Website</footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        (() => {
            const form = document.getElementById('forgot-form');
            const email = document.getElementById('forgot-email');
            const submit = form.querySelector('button[type="submit"]');
            const status = document.getElementById('forgot-status');
            function message(text, error = false) { status.textContent = text; status.classList.toggle('error', error); status.hidden = false; }
            if (!window.supabase || !['http:', 'https:'].includes(location.protocol)) { message('Open this website using Live Server and check your internet connection.', true); return; }
            const client = window.supabase.createClient(MATCHA_SUPABASE_URL, MATCHA_SUPABASE_PUBLISHABLE_KEY);
            submit.disabled = false;
            form.addEventListener('submit', async event => {
                event.preventDefault();
                submit.disabled = true; message('Sending reset link…');
                try {
                    const redirectTo = new URL('reset-password.html', location.href).href;
                    const { error } = await client.auth.resetPasswordForEmail(email.value.trim(), { redirectTo });
                    if (error) throw error;
                    message('If an account exists for that email, check your inbox for a password reset link.');
                } catch (_) { message('Unable to send a reset link right now. Try again later.', true); }
                finally { submit.disabled = false; }
            });
        })();
    </script>
</body>
</html>
